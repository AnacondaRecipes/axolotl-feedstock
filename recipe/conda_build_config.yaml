# axolotl is pure Python (nothing compiles CUDA), but it targets NVIDIA GPUs. The cuda
# variant exists only so its build/test gets routed to a GPU worker pool where the
# `__cuda` virtual package is present; no nvcc output or CUDA lib ends up in the package.
# cuda_compiler_version is therefore arbitrary/unversioned (12.x vs 13.0 would be
# byte-identical) with a single `cuda` entry. The `none`/CPU variant is kept so axolotl
# stays installable on a GPU-less machine. linux-64 only (see build/skip in meta.yaml).
gpu_variant:
  - none
  - cuda                        # [linux and x86_64]

# 12.9 (not 13.0): axolotl pins bitsandbytes ==0.49.1, whose only CUDA build is
# cuda128 (cuda-version >=12.8,<13). torchao 0.17.0 and pytorch have cuda129
# builds, so 12.9 is the common CUDA line. cuda-nvcc's run_export then pins
# cuda-version to 12.9, keeping the whole GPU stack on CUDA 12.
cuda_compiler_version:          # [linux and x86_64]
  - none                        # [linux and x86_64]
  - 12.9                        # [linux and x86_64]

zip_keys:                       # [linux and x86_64]
  -                             # [linux and x86_64]
    - gpu_variant               # [linux and x86_64]
    - cuda_compiler_version     # [linux and x86_64]
