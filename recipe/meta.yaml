{% set name = "axolotl" %}
{% set version = "0.17.0" %}
{% set build_number = 0 %}
{% set cuda_enabled = (gpu_variant or "none") == "cuda" %}
{% set build = build_number + 100 if cuda_enabled else build_number %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 3bb4ce6d8158a2b598560808d8fe5148081f79eeba7e1bd649fe3211f0c87733

build:
  # CUDA variants offset +100 so conda prefers them where __cuda is present; the CPU
  # build stays installable on GPU-less machines.
  number: {{ build }}
  # linux-64 only: hard deps triton / fla-core / liger-kernel / flash-linear-attention
  # are linux-64-only on pkgs/main. py3.10 is skipped: axolotl needs numpy >=2.2.6, but
  # numpy 2.3 dropped py3.10 so pkgs/main has no numpy >=2.2.6 for py3.10 (max 2.2.5).
  skip: true  # [not linux64 or py<311]
  # The cpu_/cuda_ prefix MUST stay or the two variants dedupe into one package. Keep
  # py{{ CONDA_PY }} too (python-specific: cpXY .pyc). No CUDA version -- nothing links a
  # toolkit; the cuda variant exists only to route build/test to a GPU worker pool.
  string: cpu_py{{ CONDA_PY }}h{{ PKG_HASH }}_{{ build }}    # [gpu_variant != "cuda"]
  string: cuda_py{{ CONDA_PY }}h{{ PKG_HASH }}_{{ build }}   # [gpu_variant == "cuda"]
  # Nothing is compiled, so drop the C/C++ run_exports; else they'd land on the cuda
  # variant only, diverging its run deps from the CPU variant's.
  ignore_run_exports_from:                  # [gpu_variant == "cuda"]
    - {{ compiler('c') }}                   # [gpu_variant == "cuda"]
    - {{ compiler('cxx') }}                 # [gpu_variant == "cuda"]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  entry_points:
    - axolotl = axolotl.cli.main:main

requirements:
  build:
    # Nothing is compiled -- axolotl is pure Python. cuda-nvcc is here only to route the
    # PBP build/test tasks to the GPU worker pool, which is what makes __cuda resolvable
    # and lets the full-stack env install (cuda pytorch/torchao/bitsandbytes) on the cuda
    # variant. compiler('c')/('cxx') are required because cuda-nvcc's activation script
    # hard-fails without them.
    - {{ compiler('c') }}                   # [gpu_variant == "cuda"]
    - {{ compiler('cxx') }}                 # [gpu_variant == "cuda"]
    - {{ compiler('cuda') }}                # [gpu_variant == "cuda"]
  host:
    - python
    - pip
    - setuptools >=64
    - setuptools_scm >=8
    - wheel
  run:
    - python
    - __cuda                                # [gpu_variant == "cuda"]
    # pytorch: the *cuda* glob on the cuda variant forces the CUDA build. This both
    # provides __cuda-backed torchao/bitsandbytes and avoids the cpu_mkl pytorch (Intel
    # OpenMP), which is mutually exclusive with numba's GNU OpenMP (_openmp_mutex).
    - pytorch >=2.9.1                        # [gpu_variant != "cuda"]
    - pytorch >=2.9.1 *cuda*                 # [gpu_variant == "cuda"]
    - packaging ==26.0
    - huggingface_hub >=1.1.7
    - peft >=0.19.1,<0.20.0
    - tokenizers >=0.22.1
    - transformers ==5.9.0
    - accelerate ==1.13.0
    - datasets >=4.8.4,<4.9.0
    - trl ==1.5.1
    - hf-xet ==1.4.3
    # kernels dropped: upstream pins kernels ==0.13.0, but co-pinned
    # transformers 5.9.0 requires kernels >=0.12.0,<0.13 (via its `kernels`
    # extra → run_constrained), which is disjoint from 0.13.0. pip hides the
    # clash (extras opt-in); conda's run_constrained enforces it. axolotl never
    # imports the HF `kernels` package (its own integrations/kernels is a local
    # module), and kernels is optional for transformers, so it is omitted here —
    # transformers' run_constrained still governs it if a user installs it.
    - trackio >=0.16.1
    - typing_extensions >=4.15.0
    # optimum: relaxed from upstream's ==1.16.2 — axolotl only imports
    # optimum.bettertransformer under `if cfg.flash_optimum:` (a lazy, deprecated
    # path removed in optimum 2.0); the base package works with newer optimum.
    - optimum >=1.16.2
    - hf-transfer
    - sentencepiece
    - gradio >=6.2.0,<7.0
    - modal-client ==1.3.0.post1
    - pydantic >=2.10.6
    - addict
    - fire
    - pyyaml >=6.0
    - requests
    - wandb
    - einops
    - colorama
    - numba >=0.61.2
    - numpy >=2.2.6
    - typer <0.26.0
    - evaluate ==0.4.1
    - scipy
    # relaxed from upstream ==12.560.30: only stable pynvml bindings are used
    - nvidia-ml-py >=12.560.30
    - art
    - tensorboard
    # relaxed from upstream ==1.0.1: only load_dotenv is used
    - python-dotenv >=1.0.1
    - s3fs >=2024.5.0
    - gcsfs >=2025.3.0
    - adlfs >=2024.5.0
    - ocifs ==1.3.2
    # relaxed from upstream ==0.22.0: the 0.22.0 conda build links zstd 1.5.5,
    # but datasets 4.8.4 → pyarrow >=21 → arrow-cpp needs zstd >=1.5.7. zstandard
    # 0.24+ links zstd 1.5.7; the Python API is unchanged, so relaxing is safe.
    - zstandard >=0.22.0
    - fastcore
    - lm_eval ==0.4.11
    - langdetect ==1.0.9
    # relaxed from upstream ==4.2.0: transitive-only, not imported by axolotl
    - immutabledict >=4.2.0
    - antlr4-python3-runtime ==4.13.2
    - schedulefree ==1.4.1
    - openenv-core ==0.1.0
    - axolotl-contribs-lgpl ==0.0.7
    - axolotl-contribs-mit ==0.0.6
    # relaxed from upstream ==6.7.11: module-level API used is preserved in 7.x
    - posthog >=6.7.11
    # relaxed from upstream ==1.11.0: stable validator/tokenizer APIs, patch diff
    - mistral-common >=1.11.0,<2
    # bitsandbytes: *cuda* on the cuda variant — its CPU builds carry a higher build
    # number, so an unconstrained solve would pick the CPU one and lose the GPU kernels.
    - bitsandbytes ==0.49.1                  # [gpu_variant != "cuda"]
    - bitsandbytes ==0.49.1 *cuda*           # [gpu_variant == "cuda"]
    - triton >=3.4.0
    - xformers >=0.0.33.post2
    # relaxed from upstream ==0.7.0: axolotl co-pins trl ==1.5.1, whose `liger`
    # extra requires liger-kernel >=0.8.0. pip hides the clash (extras are
    # opt-in) but conda's run_constrained enforces it, so 0.7.0 is unusable
    # alongside trl 1.5.1. pkgs/main ships liger-kernel 0.8.0.
    - liger-kernel >=0.8.0
    # torchao is cuda-variant only: its CPU build hard-requires pytorch cpu_mkl (Intel
    # OpenMP), which is mutually exclusive with numba's GNU OpenMP, making the CPU
    # variant unsolvable. torchao is a GPU quantization library, so the CPU build (which
    # can't train anyway) simply omits it.
    - torchao ==0.17.0                       # [gpu_variant == "cuda"]
    - fla-core ==0.4.1
    - flash-linear-attention ==0.4.1

test:
  imports:
    - axolotl
  commands:
    - pip check
    - axolotl --help
  requires:
    - pip

about:
  home: https://axolotl.ai/
  summary: Axolotl is a tool designed to streamline post-training for various AI models
  description: |
    Axolotl is a tool designed to streamline the post-training of various AI
    models. With support for multiple model architectures and training
    configurations, it offers features such as fine-tuning (LoRA, QLoRA, full
    fine-tuning), preference tuning, reward modelling, and multi-GPU / multi-node
    training via DeepSpeed and FSDP.
  license: Apache-2.0
  license_family: Apache
  license_file: LICENSE
  doc_url: https://docs.axolotl.ai/
  dev_url: https://github.com/axolotl-ai-cloud/axolotl

extra:
  recipe-maintainers:
    - winglian
